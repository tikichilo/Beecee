<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Admin Login - Bee Cee Logistics</title>
<meta name="robots" content="noindex, nofollow"/>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root{
    --bg-0:#0A0D08; --bg-1:#12160E; --bg-2:#191F13; --border:#2B341F;
    --green:#3B4A1E; --green-bright:#8CB33E; --amber:#E8A33D; --amber-dim:#7A5A26;
    --red:#D14B3F; --text-0:#EDEAE0; --text-1:#8F977E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:radial-gradient(ellipse 900px 500px at 50% -10%, rgba(59,74,30,0.35), transparent 60%), var(--bg-0);
    color:var(--text-0); font-family:"Inter",sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
    position:relative; overflow-x:hidden;
  }
  body::before{
    content:""; position:fixed; inset:0;
    background-image:linear-gradient(rgba(140,179,62,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(140,179,62,0.05) 1px, transparent 1px);
    background-size:42px 42px;
    mask-image:radial-gradient(ellipse 70% 60% at 50% 30%, black, transparent 80%);
    pointer-events:none;
  }
  body::after{ content:""; position:fixed; inset:0; box-shadow:inset 0 0 180px 40px rgba(0,0,0,0.65); pointer-events:none; }

  .panel{
    position:relative; z-index:1; width:100%; max-width:420px;
    background:linear-gradient(180deg, var(--bg-1), var(--bg-2));
    border:1px solid var(--border); border-radius:6px; padding:0 0 32px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.7), 0 0 0 1px rgba(0,0,0,0.4);
    overflow:hidden;
  }
  .panel__stripe{ height:8px; width:100%; background:repeating-linear-gradient(135deg, var(--amber) 0 10px, #14170D 10px 20px); }
  .panel__header{ display:flex; align-items:center; justify-content:space-between; padding:20px 28px 0; }
  .panel__brand{ font-family:"JetBrains Mono", monospace; font-size:11px; font-weight:700; letter-spacing:0.18em; color:var(--text-1); }
  .panel__tag{
    display:inline-flex; align-items:center; gap:6px; font-family:"JetBrains Mono", monospace; font-size:10px;
    letter-spacing:0.1em; color:var(--amber); border:1px solid var(--amber-dim); background:rgba(232,163,61,0.08);
    padding:3px 8px; border-radius:100px;
  }
  .dot{ width:6px;height:6px;border-radius:50%; background:var(--amber); animation:pulse-amber 1.8s ease-in-out infinite; }
  .dot.is-processing{ animation:pulse-fast 0.5s ease-in-out infinite; }
  .dot.is-granted{ background:var(--green-bright); animation:none; box-shadow:0 0 8px var(--green-bright); }
  .dot.is-denied{ background:var(--red); animation:pulse-fast 0.3s ease-in-out 3; }
  @keyframes pulse-amber{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }
  @keyframes pulse-fast{ 0%,100%{opacity:1;} 50%{opacity:0.25;} }

  .scene{ padding:18px 30px 4px; }
  .scene svg{ width:100%; height:auto; display:block; max-width:220px; margin:0 auto; }
  #keycard{ transform-origin:150px 54px; transition:transform 0.5s ease, opacity 0.5s ease; }
  #keycard.is-swiping{ transform:translateY(66px); opacity:0.12; }
  #keycard.is-denied{ animation:shake 0.4s ease; }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);} }
  #keycardBody{ transition:stroke 0.3s ease; }
  #keycardBody.is-granted{ stroke:var(--green-bright); }
  #keycardBody.is-denied{ stroke:var(--red); }
  #ledLight{ transition:fill 0.3s ease; }

  .panel__title{
    font-family:"Big Shoulders Display", sans-serif; font-weight:800; font-size:44px; line-height:0.92;
    text-transform:uppercase; color:var(--text-0); margin:10px 28px 6px;
  }
  .panel__title span{ color:var(--amber); }
  .panel__sub{ margin:0 28px 22px; font-size:13.5px; line-height:1.55; color:var(--text-1); }

  .panel__form{ margin:0 28px; display:flex; flex-direction:column; gap:14px; }
  .panel__label{ font-family:"JetBrains Mono", monospace; font-size:11px; font-weight:500; letter-spacing:0.12em; color:var(--text-1); }
  .panel__input{
    width:100%; background:var(--bg-0); border:1px solid var(--border); border-radius:4px; padding:13px 14px;
    font-family:"Inter", sans-serif; font-size:15px; color:var(--text-0); outline:none;
  }
  .panel__input:focus-visible{ border-color:var(--green-bright); box-shadow:0 0 0 3px rgba(140,179,62,0.18); }
  .panel__input.is-denied{ border-color:var(--red); }

  .panel__btn{
    display:flex; align-items:center; justify-content:center; gap:8px; background:var(--green); color:var(--text-0);
    border:1px solid #4C5E27; border-radius:4px; padding:13px 16px; font-family:"Inter", sans-serif;
    font-size:14px; font-weight:600; cursor:pointer; transition:background 0.2s ease, transform 0.1s ease;
  }
  .panel__btn:hover:not(:disabled){ background:#4A5D25; }
  .panel__btn:active:not(:disabled){ transform:scale(0.98); }
  .panel__btn:disabled{ opacity:0.65; cursor:default; }

  .panel__status{ font-family:"JetBrains Mono", monospace; font-size:11px; letter-spacing:0.08em; color:var(--text-1); margin:2px 0 0; min-height:14px; }
  .panel__status.is-denied{ color:var(--red); }
  .panel__status.is-granted{ color:var(--green-bright); }

  .panel__footer{ margin:22px 28px 0; display:flex; justify-content:space-between; font-size:13px; }
  .panel__footer a{ color:var(--amber); font-weight:600; text-decoration:none; }
  .panel__footer a.muted{ color:var(--text-1); font-weight:500; }
  .panel__footer a:hover{ text-decoration:underline; }

  @media (max-width:480px){ .panel__title{ font-size:36px; } }
  @media (prefers-reduced-motion: reduce){ .dot, #keycard, #keycardBody{ animation:none !important; transition:none !important; } }
</style>
</head>
<body>

<main class="panel">
  <div class="panel__stripe" aria-hidden="true"></div>
  <div class="panel__header">
    <span class="panel__brand">BEE CEE LOGISTICS</span>
    <span class="panel__tag"><span class="dot" id="statusDot"></span>TERMINAL 01 // ZM</span>
  </div>

  <div class="scene" aria-hidden="true">
    <svg viewBox="0 0 300 160" xmlns="http://www.w3.org/2000/svg">
      <rect x="70" y="86" width="160" height="54" rx="10" fill="#191F13" stroke="#2B341F"/>
      <rect x="95" y="82" width="110" height="10" rx="5" fill="#050702" stroke="#2B341F"/>
      <circle id="ledLight" cx="205" cy="113" r="5" fill="#E8A33D"/>
      <g id="keycard">
        <rect id="keycardBody" x="95" y="20" width="110" height="68" rx="8" fill="#3B4A1E" stroke="#4C5E27" stroke-width="2"/>
        <rect x="95" y="34" width="110" height="10" fill="#0A0D08" opacity="0.6"/>
        <rect x="108" y="58" width="60" height="6" rx="3" fill="rgba(237,234,224,0.5)"/>
        <rect x="108" y="70" width="40" height="6" rx="3" fill="rgba(237,234,224,0.35)"/>
      </g>
    </svg>
  </div>

  <h1 class="panel__title">Terminal<br/><span>Access</span></h1>
  <p class="panel__sub">Sign in with your issued credentials to reach the fleet dashboard.</p>

  <form id="loginForm" class="panel__form" novalidate>
    <div>
      <label class="panel__label" for="username">USERNAME</label>
      <input id="username" name="username" type="text" required autocomplete="username" class="panel__input"/>
    </div>
    <div>
      <label class="panel__label" for="password">PASSWORD</label>
      <input id="password" name="password" type="password" required autocomplete="current-password" class="panel__input"/>
    </div>
    <button type="submit" class="panel__btn" id="submitBtn">
      <span id="btnLabel">Swipe In</span>
    </button>
    <p class="panel__status" id="statusMsg">STATUS: STANDBY</p>
  </form>

  <div class="panel__footer">
    <a href="/admin/access">Sign up</a>
    <a class="muted" href="/admin/forgot-password">Forgot password?</a>
  </div>
</main>

<script>
  const form = document.getElementById("loginForm");
  const btn = document.getElementById("submitBtn");
  const btnLabel = document.getElementById("btnLabel");
  const statusMsg = document.getElementById("statusMsg");
  const statusDot = document.getElementById("statusDot");
  const keycard = document.getElementById("keycard");
  const keycardBody = document.getElementById("keycardBody");
  const ledLight = document.getElementById("ledLight");
  const usernameInput = document.getElementById("username");
  const passwordInput = document.getElementById("password");

  function setState(state, message) {
    statusMsg.textContent = message;
    statusMsg.className = "panel__status" + (state ? ` is-${state}` : "");
    statusDot.className = "dot" + (state ? ` is-${state}` : "");
    keycardBody.className = state === "granted" || state === "denied" ? `is-${state}` : "";
    usernameInput.classList.toggle("is-denied", state === "denied");
    passwordInput.classList.toggle("is-denied", state === "denied");
    ledLight.setAttribute("fill", state === "granted" ? "#8CB33E" : state === "denied" ? "#D14B3F" : "#E8A33D");
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const username = usernameInput.value.trim();
    const password = passwordInput.value;

    btn.disabled = true;
    btnLabel.textContent = "Reading…";
    keycard.classList.add("is-swiping");
    setState("processing", "STATUS: READING CARD…");

    try {
      const res = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Login failed.");

      setState("granted", "STATUS: GRANTED — WELCOME");
      btnLabel.textContent = "Granted";
      keycard.classList.remove("is-swiping");
      setTimeout(() => { window.location.href = "/admin/fleet"; }, 700);
    } catch (err) {
      keycard.classList.remove("is-swiping");
      keycard.classList.add("is-denied");
      setTimeout(() => keycard.classList.remove("is-denied"), 450);
      setState("denied", `STATUS: DENIED — ${err.message.toUpperCase()}`);
      btnLabel.textContent = "Swipe In";
      btn.disabled = false;
    }
  });

  // If already logged in, skip straight to the dashboard
  setState("processing", "STATUS: CHECKING SESSION…");
  fetch("/api/auth/me").then((r) => r.json()).then((d) => {
    if (d.loggedIn) {
      window.location.href = "/admin/fleet";
    } else {
      setState(null, "STATUS: STANDBY");
    }
  }).catch(() => setState(null, "STATUS: STANDBY"));
</script>
</body>
</html>
