<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Admin Login - Bee Cee Logistics</title>
<meta name="robots" content="noindex, nofollow"/>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  body { font-family: "Inter", sans-serif; background:#f8f9fa; }
  .brand { font-family: "Montserrat", sans-serif; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">
<div class="w-full max-w-sm bg-white border border-gray-200 rounded-lg shadow-sm p-8">
  <h1 class="brand text-2xl font-bold text-[#3B4A1E] mb-1">Bee Cee Logistics</h1>
  <p class="text-gray-500 text-sm mb-6">Fleet dashboard login</p>

  <form id="loginForm" class="flex flex-col gap-4">
    <div>
      <label class="block text-sm font-medium mb-1" for="username">Username</label>
      <input id="username" name="username" type="text" required autocomplete="username"
        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#3B4A1E]"/>
    </div>
    <div>
      <label class="block text-sm font-medium mb-1" for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password"
        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#3B4A1E]"/>
    </div>
    <p id="errorMsg" class="text-sm text-red-600 hidden"></p>
    <button type="submit" class="bg-[#3B4A1E] text-white font-semibold rounded py-2 hover:opacity-90 transition">
      Log In
    </button>
  </form>
</div>

<script>
  const form = document.getElementById("loginForm");
  const errorMsg = document.getElementById("errorMsg");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorMsg.classList.add("hidden");
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    try {
      const res = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Login failed.");
      window.location.href = "/admin/fleet";
    } catch (err) {
      errorMsg.textContent = err.message;
      errorMsg.classList.remove("hidden");
    }
  });

  // If already logged in, skip straight to the dashboard
  fetch("/api/auth/me").then((r) => r.json()).then((d) => {
    if (d.loggedIn) window.location.href = "/admin/fleet";
  });
</script>
</body>
</html>
