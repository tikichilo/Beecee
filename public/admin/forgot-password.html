<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Forgot Password - Bee Cee Logistics</title>
<meta name="robots" content="noindex, nofollow"/>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  body { font-family: "Inter", sans-serif; background:#f8f9fa; }
  .brand { font-family: "Montserrat", sans-serif; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">
<div class="w-full max-w-sm bg-white border border-gray-200 rounded-lg shadow-sm p-8">
  <h1 class="brand text-2xl font-bold text-[#3B4A1E] mb-1">Bee Cee Logistics</h1>
  <p class="text-gray-500 text-sm mb-6">Enter the email on your admin account and we'll send a reset link.</p>

  <form id="forgotForm" class="flex flex-col gap-4">
    <div>
      <label class="block text-sm font-medium mb-1" for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="email"
        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#3B4A1E]"/>
    </div>
    <p id="errorMsg" class="text-sm text-red-600 hidden"></p>
    <p id="successMsg" class="text-sm text-green-700 hidden">
      If that email matches an account, a reset link is on its way. Check your inbox.
    </p>
    <button id="submitBtn" type="submit" class="bg-[#3B4A1E] text-white font-semibold rounded py-2 hover:opacity-90 transition">
      Send Reset Link
    </button>
  </form>

  <p class="text-sm text-gray-500 mt-6 text-center">
    <a class="text-[#3B4A1E] font-medium hover:underline" href="/admin">Back to log in</a>
  </p>
</div>

<script>
  const form = document.getElementById("forgotForm");
  const errorMsg = document.getElementById("errorMsg");
  const successMsg = document.getElementById("successMsg");
  const submitBtn = document.getElementById("submitBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorMsg.classList.add("hidden");
    successMsg.classList.add("hidden");
    const email = document.getElementById("email").value.trim();

    try {
      submitBtn.disabled = true;
      const res = await fetch("/api/auth/forgot-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Something went wrong.");
      successMsg.classList.remove("hidden");
      form.reset();
    } catch (err) {
      errorMsg.textContent = err.message;
      errorMsg.classList.remove("hidden");
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
