<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Forgot Password - Bee Cee Logistics</title>
<meta name="robots" content="noindex, nofollow"/>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root{
    --bg-0:#0A0D08; --bg-1:#12160E; --bg-2:#191F13; --border:#2B341F;
    --green:#3B4A1E; --green-bright:#8CB33E; --amber:#E8A33D; --amber-dim:#7A5A26;
    --red:#D14B3F; --text-0:#EDEAE0; --text-1:#8F977E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:radial-gradient(ellipse 900px 500px at 50% -10%, rgba(59,74,30,0.35), transparent 60%), var(--bg-0);
    color:var(--text-0); font-family:"Inter",sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
    position:relative; overflow-x:hidden;
  }
  body::before{
    content:""; position:fixed; inset:0;
    background-image:linear-gradient(rgba(140,179,62,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(140,179,62,0.05) 1px, transparent 1px);
    background-size:42px 42px;
    mask-image:radial-gradient(ellipse 70% 60% at 50% 30%, black, transparent 80%);
    pointer-events:none;
  }
  body::after{ content:""; position:fixed; inset:0; box-shadow:inset 0 0 180px 40px rgba(0,0,0,0.65); pointer-events:none; }

  .page-stack{ position:relative; z-index:1; width:100%; max-width:400px; display:flex; flex-direction:column; gap:14px; }

  .back-link{
    display:inline-flex; align-items:center; gap:6px; align-self:flex-start;
    font-family:"JetBrains Mono", monospace; font-size:11px; font-weight:500; letter-spacing:0.1em;
    color:var(--text-1); text-decoration:none; padding:6px 2px; transition:color 0.15s ease;
  }
  .back-link:hover{ color:var(--green-bright); }
  .back-link svg{ width:13px; height:13px; flex-shrink:0; }

  .panel{
    position:relative; width:100%;
    background:linear-gradient(180deg, var(--bg-1), var(--bg-2));
    border:1px solid var(--border); border-radius:6px; padding:0 0 32px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.7), 0 0 0 1px rgba(0,0,0,0.4);
    overflow:hidden;
  }
  .panel__stripe{ height:8px; width:100%; background:repeating-linear-gradient(135deg, var(--amber) 0 10px, #14170D 10px 20px); }
  .panel__header{ display:flex; align-items:center; justify-content:space-between; padding:20px 28px 0; }
  .panel__brand{ font-family:"JetBrains Mono", monospace; font-size:11px; font-weight:700; letter-spacing:0.18em; color:var(--text-1); }
  .panel__tag{
    display:inline-flex; align-items:center; gap:6px; font-family:"JetBrains Mono", monospace; font-size:10px;
    letter-spacing:0.1em; color:var(--amber); border:1px solid var(--amber-dim); background:rgba(232,163,61,0.08);
    padding:3px 8px; border-radius:100px;
  }
  .dot{ width:6px;height:6px;border-radius:50%; background:var(--amber); animation:pulse-amber 1.8s ease-in-out infinite; }
  .dot.is-processing{ animation:pulse-fast 0.5s ease-in-out infinite; }
  .dot.is-granted{ background:var(--green-bright); animation:none; box-shadow:0 0 8px var(--green-bright); }
  .dot.is-denied{ background:var(--red); animation:pulse-fast 0.3s ease-in-out 3; }
  @keyframes pulse-amber{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }
  @keyframes pulse-fast{ 0%,100%{opacity:1;} 50%{opacity:0.25;} }

  .scene{ padding:18px 30px 4px; }
  .scene svg{ width:100%; height:auto; display:block; max-width:170px; margin:0 auto; }
  #envelope{ transform-origin:150px 90px; transition:transform 0.5s ease, opacity 0.5s ease; }
  #envelope.is-sending{ transform:translateY(-10px) rotate(-4deg); opacity:0.65; }
  #envelope.is-denied{ animation:shake 0.4s ease; }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);} }
  #envelopeBody{ transition:stroke 0.3s ease; }
  #envelopeBody.is-granted{ stroke:var(--green-bright); }
  #envelopeBody.is-denied{ stroke:var(--red); }
  #envelopePulse{ transition:opacity 0.3s ease; opacity:0; }
  #envelopePulse.is-visible{ opacity:1; }

  .panel__title{
    font-family:"Big Shoulders Display", sans-serif; font-weight:800; font-size:38px; line-height:0.92;
    text-transform:uppercase; color:var(--text-0); text-align:center; margin:10px 28px 6px;
  }
  .panel__title span{ color:var(--amber); }
  .panel__sub{ margin:0 28px 22px; font-size:13.5px; line-height:1.55; color:var(--text-1); text-align:center; }

  .panel__form{ margin:0 28px; display:flex; flex-direction:column; gap:14px; }
  .panel__label{ font-family:"JetBrains Mono", monospace; font-size:11px; font-weight:500; letter-spacing:0.12em; color:var(--text-1); }
  .panel__input{
    width:100%; background:var(--bg-0); border:1px solid var(--border); border-radius:4px; padding:13px 14px;
    font-family:"Inter", sans-serif; font-size:15px; color:var(--text-0); outline:none;
  }
  .panel__input:focus-visible{ border-color:var(--green-bright); box-shadow:0 0 0 3px rgba(140,179,62,0.18); }
  .panel__input.is-denied{ border-color:var(--red); }

  .panel__btn{
    display:flex; align-items:center; justify-content:center; gap:8px; background:var(--green); color:var(--text-0);
    border:1px solid #4C5E27; border-radius:4px; padding:13px 16px; font-family:"Inter", sans-serif;
    font-size:14px; font-weight:600; cursor:pointer; transition:background 0.2s ease, transform 0.1s ease;
  }
  .panel__btn:hover:not(:disabled){ background:#4A5D25; }
  .panel__btn:active:not(:disabled){ transform:scale(0.98); }
  .panel__btn:disabled{ opacity:0.65; cursor:default; }

  .panel__status{ font-family:"JetBrains Mono", monospace; font-size:11px; letter-spacing:0.08em; color:var(--text-1); margin:2px 0 0; min-height:14px; text-align:center; }
  .panel__status.is-denied{ color:var(--red); }
  .panel__status.is-granted{ color:var(--green-bright); }

  .panel__footer{ margin:22px 28px 0; text-align:center; font-size:13px; }
  .panel__footer a{ color:var(--amber); font-weight:600; text-decoration:none; }
  .panel__footer a:hover{ text-decoration:underline; }

  @media (max-width:480px){ .panel__title{ font-size:32px; } }
  @media (prefers-reduced-motion: reduce){ .dot, #envelope, #envelopeBody, #envelopePulse{ animation:none !important; transition:none !important; } }
</style>
</head>
<body>

<div class="page-stack">
  <a href="/admin" class="back-link">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    Back to log in
  </a>

  <main class="panel">
    <div class="panel__stripe" aria-hidden="true"></div>
    <div class="panel__header">
      <span class="panel__brand">BEE CEE LOGISTICS</span>
      <span class="panel__tag"><span class="dot" id="statusDot"></span>TERMINAL 01 // ZM</span>
    </div>

    <div class="scene" aria-hidden="true">
      <svg viewBox="0 0 300 160" xmlns="http://www.w3.org/2000/svg">
        <circle id="envelopePulse" cx="150" cy="90" r="52" fill="none" stroke="#8CB33E" stroke-width="2" opacity="0"/>
        <g id="envelope">
          <rect id="envelopeBody" x="95" y="56" width="110" height="68" rx="8" fill="#191F13" stroke="#2B341F" stroke-width="2"/>
          <path d="M95 62 L150 100 L205 62" fill="none" stroke="#8F977E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </svg>
    </div>

    <h1 class="panel__title">Reset<br/><span>Request</span></h1>
    <p class="panel__sub">Enter the email on your admin account and we'll send a reset link.</p>

    <form id="forgotForm" class="panel__form" novalidate>
      <div>
        <label class="panel__label" for="email">EMAIL</label>
        <input id="email" name="email" type="email" required autocomplete="email" class="panel__input"/>
      </div>
      <button type="submit" class="panel__btn" id="submitBtn">
        <span id="btnLabel">Send Reset Link</span>
      </button>
      <p class="panel__status" id="statusMsg">STATUS: STANDBY</p>
    </form>

    <div class="panel__footer">
      <a href="/admin">Back to log in</a>
    </div>
  </main>
</div>

<script>
  const form = document.getElementById("forgotForm");
  const btn = document.getElementById("submitBtn");
  const btnLabel = document.getElementById("btnLabel");
  const statusMsg = document.getElementById("statusMsg");
  const statusDot = document.getElementById("statusDot");
  const envelope = document.getElementById("envelope");
  const envelopeBody = document.getElementById("envelopeBody");
  const envelopePulse = document.getElementById("envelopePulse");
  const emailInput = document.getElementById("email");

  function setState(state, message) {
    statusMsg.textContent = message;
    statusMsg.className = "panel__status" + (state ? ` is-${state}` : "");
    statusDot.className = "dot" + (state ? ` is-${state}` : "");
    envelopeBody.className = state === "granted" || state === "denied" ? `is-${state}` : "";
    emailInput.classList.toggle("is-denied", state === "denied");
    envelopePulse.classList.toggle("is-visible", state === "granted");
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = emailInput.value.trim();

    btn.disabled = true;
    btnLabel.textContent = "Sending…";
    envelope.classList.add("is-sending");
    setState("processing", "STATUS: SENDING REQUEST…");

    try {
      const res = await fetch("/api/auth/forgot-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Something went wrong.");

      envelope.classList.remove("is-sending");
      setState("granted", "STATUS: SENT — CHECK YOUR INBOX");
      btnLabel.textContent = "Link Sent";
      form.reset();
    } catch (err) {
      envelope.classList.remove("is-sending");
      envelope.classList.add("is-denied");
      setTimeout(() => envelope.classList.remove("is-denied"), 450);
      setState("denied", `STATUS: FAILED — ${err.message.toUpperCase()}`);
      btnLabel.textContent = "Send Reset Link";
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
