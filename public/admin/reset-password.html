<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Reset Password - Bee Cee Logistics</title>
<meta name="robots" content="noindex, nofollow"/>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root{
    --bg-0:#0A0D08; --bg-1:#12160E; --bg-2:#191F13; --border:#2B341F;
    --green:#3B4A1E; --green-bright:#8CB33E; --amber:#E8A33D; --amber-dim:#7A5A26;
    --red:#D14B3F; --text-0:#EDEAE0; --text-1:#8F977E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:radial-gradient(ellipse 900px 500px at 50% -10%, rgba(59,74,30,0.35), transparent 60%), var(--bg-0);
    color:var(--text-0); font-family:"Inter",sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
    position:relative; overflow-x:hidden;
  }
  body::before{
    content:""; position:fixed; inset:0;
    background-image:linear-gradient(rgba(140,179,62,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(140,179,62,0.05) 1px, transparent 1px);
    background-size:42px 42px;
    mask-image:radial-gradient(ellipse 70% 60% at 50% 30%, black, transparent 80%);
    pointer-events:none;
  }
  body::after{ content:""; position:fixed; inset:0; box-shadow:inset 0 0 180px 40px rgba(0,0,0,0.65); pointer-events:none; }

  .panel{
    position:relative; z-index:1; width:100%; max-width:400px;
    background:linear-gradient(180deg, var(--bg-1), var(--bg-2));
    border:1px solid var(--border); border-radius:6px; padding:0 0 32px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.7), 0 0 0 1px rgba(0,0,0,0.4);
    overflow:hidden;
  }
  .panel__stripe{ height:8px; width:100%; background:repeating-linear-gradient(135deg, var(--amber) 0 10px, #14170D 10px 20px); }
  .panel__header{ padding:20px 28px 0; }
  .panel__brand{ font-family:"JetBrains Mono", monospace; font-size:11px; font-weight:700; letter-spacing:0.18em; color:var(--text-1); }

  .lock-wrap{ display:flex; justify-content:center; padding:22px 0 6px; }
  .lock-wrap svg{ width:60px; height:60px; }
  #shackle{ transform-origin:30px 24px; transition:transform 0.5s ease; }
  #shackle.is-unlocked{ transform:rotate(-25deg) translate(-3px,-2px); }
  #lockBody{ transition:fill 0.3s ease; }
  #lockBody.is-denied{ animation:shake 0.4s ease; }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-4px);} 75%{transform:translateX(4px);} }

  .panel__title{
    font-family:"Big Shoulders Display", sans-serif; font-weight:800; font-size:34px; line-height:0.95;
    text-transform:uppercase; color:var(--text-0); text-align:center; margin:8px 28px 4px;
  }
  .panel__title span{ color:var(--amber); }
  .panel__sub{ margin:0 28px 22px; font-size:13.5px; line-height:1.55; color:var(--text-1); text-align:center; }

  .panel__form{ margin:0 28px; display:flex; flex-direction:column; gap:14px; }
  .panel__label{ font-family:"JetBrains Mono", monospace; font-size:11px; font-weight:500; letter-spacing:0.12em; color:var(--text-1); }
  .panel__input{
    width:100%; background:var(--bg-0); border:1px solid var(--border); border-radius:4px; padding:13px 14px;
    font-family:"Inter", sans-serif; font-size:15px; color:var(--text-0); outline:none;
  }
  .panel__input:focus-visible{ border-color:var(--green-bright); box-shadow:0 0 0 3px rgba(140,179,62,0.18); }
  .panel__hint{ font-size:11.5px; color:var(--text-1); margin:6px 2px 0; }

  /* Password show/hide toggle — password-toggle.js wraps the input in
     .password-wrap and injects the .password-toggle button. */
  .password-wrap{ position:relative; }
  .password-wrap .panel__input{ padding-right:44px; }
  .password-toggle{
    position:absolute; top:50%; right:6px; transform:translateY(-50%);
    width:30px; height:30px; display:flex; align-items:center; justify-content:center;
    background:transparent; border:none; color:var(--text-1); cursor:pointer;
    border-radius:4px; transition:color 0.15s ease, background-color 0.15s ease;
  }
  .password-toggle:hover{ color:var(--green-bright); background:rgba(140,179,62,0.1); }
  .password-toggle:focus-visible{ outline:2px solid var(--green-bright); outline-offset:2px; }
  .password-toggle svg{ width:18px; height:18px; }

  /* Live password requirement checklist */
  .pw-requirements{ list-style:none; margin:8px 0 0; padding:0; display:flex; flex-direction:column; gap:4px; }
  .pw-requirements li{
    font-size:11.5px; color:var(--text-1); display:flex; align-items:center; gap:6px;
    transition:color 0.15s ease;
  }
  .pw-requirements li::before{ content:"○"; font-size:9px; }
  .pw-requirements li.is-met{ color:var(--green-bright); }
  .pw-requirements li.is-met::before{ content:"●"; }

  .panel__btn{
    display:flex; align-items:center; justify-content:center; gap:8px; background:var(--green); color:var(--text-0);
    border:1px solid #4C5E27; border-radius:4px; padding:13px 16px; font-family:"Inter", sans-serif;
    font-size:14px; font-weight:600; cursor:pointer; transition:background 0.2s ease, transform 0.1s ease;
  }
  .panel__btn:hover:not(:disabled){ background:#4A5D25; }
  .panel__btn:active:not(:disabled){ transform:scale(0.98); }
  .panel__btn:disabled{ opacity:0.65; cursor:default; }

  .panel__status{ font-family:"JetBrains Mono", monospace; font-size:11px; letter-spacing:0.08em; color:var(--text-1); margin:2px 0 0; min-height:14px; text-align:center; }
  .panel__status.is-denied{ color:var(--red); }
  .panel__status.is-granted{ color:var(--green-bright); }

  @media (prefers-reduced-motion: reduce){ #shackle, #lockBody{ animation:none !important; transition:none !important; } }
</style>
</head>
<body>

<main class="panel">
  <div class="panel__stripe" aria-hidden="true"></div>
  <div class="panel__header">
    <span class="panel__brand">BEE CEE LOGISTICS</span>
  </div>

  <div class="lock-wrap" aria-hidden="true">
    <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
      <g id="shackle">
        <path d="M18 24 V16 a12 12 0 0 1 24 0 v8" fill="none" stroke="#8F977E" stroke-width="4" stroke-linecap="round"/>
      </g>
      <rect id="lockBody" x="12" y="24" width="36" height="26" rx="5" fill="#3B4A1E" stroke="#4C5E27" stroke-width="2"/>
      <circle cx="30" cy="36" r="3.5" fill="#0A0D08"/>
      <rect x="28.5" y="37" width="3" height="7" fill="#0A0D08"/>
    </svg>
  </div>

  <h1 class="panel__title" id="titleText">Reset<br/><span>Credentials</span></h1>
  <p class="panel__sub" id="subtitle">Choose a new password to restore access.</p>

  <form id="resetForm" class="panel__form" novalidate>
    <div>
      <label class="panel__label" for="password">NEW PASSWORD</label>
      <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password" class="panel__input" data-password-toggle/>
      <ul class="pw-requirements" id="pwRequirements">
        <li data-rule="length">At least 8 characters</li>
        <li data-rule="lower">A lowercase letter</li>
        <li data-rule="upper">An uppercase letter</li>
        <li data-rule="number">A number</li>
        <li data-rule="symbol">A symbol (e.g. ! @ # $ %)</li>
      </ul>
    </div>
    <div>
      <label class="panel__label" for="confirm">CONFIRM PASSWORD</label>
      <input id="confirm" name="confirm" type="password" required minlength="8" autocomplete="new-password" class="panel__input" data-password-toggle/>
    </div>
    <button id="submitBtn" type="submit" class="panel__btn">
      <span id="btnLabel">Unlock Account</span>
    </button>
    <p class="panel__status" id="statusMsg">STATUS: LOCKED</p>
  </form>
</main>

<script src="/js/password-toggle.js" defer></script>
<script>
  const token = new URLSearchParams(window.location.search).get("token");
  const form = document.getElementById("resetForm");
  const btn = document.getElementById("submitBtn");
  const btnLabel = document.getElementById("btnLabel");
  const statusMsg = document.getElementById("statusMsg");
  const shackle = document.getElementById("shackle");
  const lockBody = document.getElementById("lockBody");
  const passwordInput = document.getElementById("password");
  const pwRequirementsList = document.getElementById("pwRequirements");

  if (!token) {
    document.getElementById("subtitle").textContent = "This reset link is missing its token.";
    document.getElementById("titleText").innerHTML = 'Link<br/><span>Invalid</span>';
    statusMsg.textContent = "STATUS: NO TOKEN";
    form.classList.add("hidden");
    form.style.display = "none";
  }

  // Mirrors the server-side rules in utils/passwordPolicy.js. If you
  // change a rule there, update this object to match, or the checklist
  // will show green while the server still rejects the password.
  const PW_RULES = {
    length: (v) => v.length >= 8,
    lower: (v) => /[a-z]/.test(v),
    upper: (v) => /[A-Z]/.test(v),
    number: (v) => /[0-9]/.test(v),
    symbol: (v) => /[^A-Za-z0-9]/.test(v),
  };

  function updatePwRequirements(value) {
    let allMet = true;
    pwRequirementsList.querySelectorAll("li[data-rule]").forEach((li) => {
      const rule = li.getAttribute("data-rule");
      const met = PW_RULES[rule] ? PW_RULES[rule](value) : false;
      li.classList.toggle("is-met", met);
      if (!met) allMet = false;
    });
    return allMet;
  }

  passwordInput.addEventListener("input", () => updatePwRequirements(passwordInput.value));

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const password = passwordInput.value;
    const confirm = document.getElementById("confirm").value;

    if (password !== confirm) {
      statusMsg.className = "panel__status is-denied";
      statusMsg.textContent = "STATUS: PASSWORDS DON'T MATCH";
      return;
    }

    // Client-side pre-check — the server re-validates regardless, this
    // just avoids a round trip for an obviously weak password.
    if (!updatePwRequirements(password)) {
      statusMsg.className = "panel__status is-denied";
      statusMsg.textContent = "STATUS: PASSWORD DOESN'T MEET REQUIREMENTS YET";
      return;
    }

    try {
      btn.disabled = true;
      btnLabel.textContent = "Unlocking…";
      statusMsg.className = "panel__status";
      statusMsg.textContent = "STATUS: UPDATING…";

      const res = await fetch("/api/auth/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, password }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Couldn't reset your password.");

      shackle.classList.add("is-unlocked");
      statusMsg.className = "panel__status is-granted";
      statusMsg.textContent = "STATUS: UNLOCKED — REDIRECTING";
      btnLabel.textContent = "Unlocked";

      setTimeout(() => (window.location.href = "/admin"), 1600);
    } catch (err) {
      lockBody.classList.add("is-denied");
      setTimeout(() => lockBody.classList.remove("is-denied"), 450);
      statusMsg.className = "panel__status is-denied";
      statusMsg.textContent = `STATUS: ${err.message.toUpperCase()}`;
      btnLabel.textContent = "Unlock Account";
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
