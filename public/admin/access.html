<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Admin Access - Bee Cee Logistics</title>
<meta name="robots" content="noindex, nofollow"/>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root{
    --bg-0:#0A0D08;
    --bg-1:#12160E;
    --bg-2:#191F13;
    --border:#2B341F;
    --green:#3B4A1E;
    --green-bright:#8CB33E;
    --amber:#E8A33D;
    --amber-dim:#7A5A26;
    --red:#D14B3F;
    --text-0:#EDEAE0;
    --text-1:#8F977E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(59,74,30,0.35), transparent 60%),
      var(--bg-0);
    color:var(--text-0);
    font-family:"Inter",sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    position:relative;
    overflow-x:hidden;
  }
  /* ambient grid + vignette */
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      linear-gradient(rgba(140,179,62,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(140,179,62,0.05) 1px, transparent 1px);
    background-size:42px 42px;
    mask-image:radial-gradient(ellipse 70% 60% at 50% 30%, black, transparent 80%);
    pointer-events:none;
  }
  body::after{
    content:"";
    position:fixed; inset:0;
    box-shadow: inset 0 0 180px 40px rgba(0,0,0,0.65);
    pointer-events:none;
  }

  .checkpoint{
    position:relative;
    z-index:1;
    width:100%;
    max-width:420px;
    background:linear-gradient(180deg, var(--bg-1), var(--bg-2));
    border:1px solid var(--border);
    border-radius:6px;
    padding:0 0 32px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.7), 0 0 0 1px rgba(0,0,0,0.4);
    overflow:hidden;
  }

  /* hazard stripe top bar */
  .checkpoint__stripe{
    height:8px;
    width:100%;
    background:repeating-linear-gradient(135deg, var(--amber) 0 10px, #14170D 10px 20px);
  }

  .checkpoint__header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 28px 0;
  }
  .checkpoint__brand{
    font-family:"JetBrains Mono", monospace;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.18em;
    color:var(--text-1);
  }
  .checkpoint__gate-tag{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:"JetBrains Mono", monospace;
    font-size:10px;
    letter-spacing:0.1em;
    color:var(--amber);
    border:1px solid var(--amber-dim);
    background:rgba(232,163,61,0.08);
    padding:3px 8px;
    border-radius:100px;
  }
  .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--amber);
    animation:pulse-amber 1.8s ease-in-out infinite;
  }
  .dot.is-processing{ background:var(--amber); animation:pulse-fast 0.5s ease-in-out infinite; }
  .dot.is-granted{ background:var(--green-bright); animation:none; box-shadow:0 0 8px var(--green-bright); }
  .dot.is-denied{ background:var(--red); animation:pulse-fast 0.3s ease-in-out 3; }

  @keyframes pulse-amber{
    0%,100%{ opacity:1; }
    50%{ opacity:0.35; }
  }
  @keyframes pulse-fast{
    0%,100%{ opacity:1; }
    50%{ opacity:0.25; }
  }

  /* gate scene */
  .gate-scene{
    padding:18px 20px 4px;
  }
  .gate-scene svg{ width:100%; height:auto; display:block; }

  #gateArm{
    transform-origin:46px 58px;
    transition:transform 0.65s cubic-bezier(.2,.9,.3,1.3);
  }
  #gateArm.is-open{ transform:rotate(-78deg); }
  #gateArm.is-denied{ animation:shake 0.45s ease; }
  @keyframes shake{
    0%,100%{ transform:rotate(0deg) translateX(0); }
    20%{ transform:rotate(0deg) translateX(-4px); }
    40%{ transform:rotate(0deg) translateX(4px); }
    60%{ transform:rotate(0deg) translateX(-3px); }
    80%{ transform:rotate(0deg) translateX(3px); }
  }
  #signalLight{ transition:fill 0.3s ease; }

  .checkpoint__title{
    font-family:"Big Shoulders Display", sans-serif;
    font-weight:800;
    font-size:44px;
    line-height:0.92;
    letter-spacing:0.01em;
    text-transform:uppercase;
    color:var(--text-0);
    margin:14px 28px 6px;
  }
  .checkpoint__title span{ color:var(--amber); }

  .checkpoint__sub{
    margin:0 28px 22px;
    font-size:13.5px;
    line-height:1.55;
    color:var(--text-1);
  }

  .checkpoint__form{
    margin:0 28px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .checkpoint__label{
    font-family:"JetBrains Mono", monospace;
    font-size:11px;
    font-weight:500;
    letter-spacing:0.12em;
    color:var(--text-1);
  }
  .checkpoint__input-wrap{ position:relative; overflow:hidden; border-radius:4px; }
  .checkpoint__input{
    width:100%;
    background:var(--bg-0);
    border:1px solid var(--border);
    border-radius:4px;
    padding:13px 14px;
    font-family:"JetBrains Mono", monospace;
    font-size:16px;
    letter-spacing:0.15em;
    text-transform:uppercase;
    color:var(--text-0);
    outline:none;
  }
  .checkpoint__input::placeholder{ color:#4A5238; letter-spacing:0.1em; }
  .checkpoint__input:focus-visible{
    border-color:var(--green-bright);
    box-shadow:0 0 0 3px rgba(140,179,62,0.18);
  }
  .checkpoint__input.is-denied{ border-color:var(--red); }

  .scan-line{
    position:absolute; top:0; left:-30%;
    width:30%; height:100%;
    background:linear-gradient(90deg, transparent, rgba(140,179,62,0.35), transparent);
    pointer-events:none;
  }
  .scan-line.is-active{ animation:scan 0.9s ease-in-out infinite; }
  @keyframes scan{
    0%{ left:-30%; }
    100%{ left:100%; }
  }

  .checkpoint__btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:var(--green);
    color:var(--text-0);
    border:1px solid #4C5E27;
    border-radius:4px;
    padding:13px 16px;
    font-family:"Inter", sans-serif;
    font-size:14px;
    font-weight:600;
    letter-spacing:0.02em;
    cursor:pointer;
    transition:background 0.2s ease, transform 0.1s ease;
  }
  .checkpoint__btn:hover:not(:disabled){ background:#4A5D25; }
  .checkpoint__btn:active:not(:disabled){ transform:scale(0.98); }
  .checkpoint__btn:disabled{ opacity:0.65; cursor:default; }
  .checkpoint__btn-arrow{ transition:transform 0.2s ease; }
  .checkpoint__btn:hover:not(:disabled) .checkpoint__btn-arrow{ transform:translateX(3px); }

  .checkpoint__status{
    font-family:"JetBrains Mono", monospace;
    font-size:11px;
    letter-spacing:0.08em;
    color:var(--text-1);
    margin:2px 0 0;
    min-height:14px;
  }
  .checkpoint__status.is-denied{ color:var(--red); }
  .checkpoint__status.is-granted{ color:var(--green-bright); }

  .checkpoint__footer{
    margin:22px 28px 0;
    font-size:13px;
    color:var(--text-1);
    text-align:center;
  }
  .checkpoint__footer a{ color:var(--amber); font-weight:600; text-decoration:none; }
  .checkpoint__footer a:hover{ text-decoration:underline; }

  /* success stamp */
  .stamp{
    position:fixed;
    top:50%; left:50%;
    transform:translate(-50%,-50%) rotate(-8deg) scale(0.7);
    font-family:"Big Shoulders Display", sans-serif;
    font-weight:800;
    font-size:42px;
    line-height:0.95;
    text-align:center;
    letter-spacing:0.05em;
    color:var(--green-bright);
    border:5px solid var(--green-bright);
    border-radius:8px;
    padding:14px 28px;
    opacity:0;
    pointer-events:none;
    z-index:10;
    transition:opacity 0.25s ease, transform 0.25s ease;
  }
  .stamp.is-visible{
    opacity:1;
    transform:translate(-50%,-50%) rotate(-8deg) scale(1);
  }

  @media (max-width:480px){
    .checkpoint__title{ font-size:36px; }
  }
  @media (prefers-reduced-motion: reduce){
    .dot, #gateArm, .scan-line, .stamp{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<main class="checkpoint">
  <div class="checkpoint__stripe" aria-hidden="true"></div>

  <div class="checkpoint__header">
    <span class="checkpoint__brand">BEE CEE LOGISTICS</span>
    <span class="checkpoint__gate-tag"><span class="dot" id="statusDot"></span>GATE 01 // ZM</span>
  </div>

  <div class="gate-scene" aria-hidden="true">
    <svg viewBox="0 0 440 150" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="hazard" width="16" height="16" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
          <rect width="16" height="16" fill="#14170D"/>
          <rect width="8" height="16" fill="#E8A33D"/>
        </pattern>
      </defs>
      <!-- road -->
      <rect x="0" y="112" width="440" height="18" fill="#191F13"/>
      <line x1="60" y1="121" x2="380" y2="121" stroke="#3E4630" stroke-width="3" stroke-dasharray="14 10"/>
      <!-- posts -->
      <rect x="26" y="42" width="18" height="88" rx="3" fill="#191F13" stroke="#2B341F"/>
      <rect x="396" y="42" width="18" height="88" rx="3" fill="#191F13" stroke="#2B341F"/>
      <!-- signal light -->
      <circle id="signalLight" cx="405" cy="34" r="7" fill="#E8A33D"/>
      <!-- gate arm group, pivots at the left post -->
      <g id="gateArm">
        <rect x="18" y="48" width="30" height="22" rx="3" fill="#191F13" stroke="#2B341F"/>
        <rect x="46" y="52" width="340" height="13" rx="6" fill="url(#hazard)" stroke="#0A0D08"/>
      </g>
    </svg>
  </div>

  <h1 class="checkpoint__title">Clearance<br/><span>Required</span></h1>
  <p class="checkpoint__sub">This checkpoint confirms your invite code before account setup opens up.</p>

  <form id="accessForm" class="checkpoint__form" novalidate>
    <label for="code" class="checkpoint__label">CLEARANCE CODE</label>
    <div class="checkpoint__input-wrap">
      <input id="code" name="code" type="text" required autocomplete="off" spellcheck="false" placeholder="ENTER CODE"
        class="checkpoint__input"/>
      <span class="scan-line" id="scanLine" aria-hidden="true"></span>
    </div>
    <button type="submit" class="checkpoint__btn" id="submitBtn">
      <span class="checkpoint__btn-label" id="btnLabel">Request Clearance</span>
      <span class="checkpoint__btn-arrow">→</span>
    </button>
    <p class="checkpoint__status" id="statusMsg">STATUS: STANDBY</p>
  </form>

  <p class="checkpoint__footer">Already cleared? <a href="/admin">Log in</a></p>
</main>

<div class="stamp" id="stamp" aria-hidden="true">ACCESS<br/>GRANTED</div>

<script>
  const form = document.getElementById("accessForm");
  const codeInput = document.getElementById("code");
  const btn = document.getElementById("submitBtn");
  const btnLabel = document.getElementById("btnLabel");
  const statusMsg = document.getElementById("statusMsg");
  const statusDot = document.getElementById("statusDot");
  const gateArm = document.getElementById("gateArm");
  const signalLight = document.getElementById("signalLight");
  const scanLine = document.getElementById("scanLine");
  const stamp = document.getElementById("stamp");

  function setState(state, message) {
    statusMsg.textContent = message;
    statusMsg.className = "checkpoint__status" + (state ? ` is-${state}` : "");
    statusDot.className = "dot" + (state ? ` is-${state}` : "");
    codeInput.classList.toggle("is-denied", state === "denied");
    if (state === "granted") signalLight.setAttribute("fill", "#8CB33E");
    else if (state === "denied") signalLight.setAttribute("fill", "#D14B3F");
    else signalLight.setAttribute("fill", "#E8A33D");
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const code = codeInput.value.trim();
    if (!code) return;

    btn.disabled = true;
    btnLabel.textContent = "Verifying…";
    scanLine.classList.add("is-active");
    gateArm.classList.remove("is-denied");
    setState("processing", "STATUS: VERIFYING…");

    try {
      const res = await fetch("/api/auth/verify-invite", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "That code isn't valid.");

      // Carried over to /admin/signup so the person isn't asked to
      // retype it — the signup endpoint re-checks it server-side
      // regardless, so this is a UX convenience, not the real gate.
      sessionStorage.setItem("beecee_invite_code", code);

      scanLine.classList.remove("is-active");
      gateArm.classList.add("is-open");
      btnLabel.textContent = "Cleared";
      setState("granted", "STATUS: CLEARED — REDIRECTING");
      stamp.classList.add("is-visible");

      setTimeout(() => { window.location.href = "/admin/signup"; }, 900);
    } catch (err) {
      scanLine.classList.remove("is-active");
      gateArm.classList.add("is-denied");
      setTimeout(() => gateArm.classList.remove("is-denied"), 500);
      btnLabel.textContent = "Request Clearance";
      btn.disabled = false;
      setState("denied", `STATUS: DENIED — ${err.message.toUpperCase()}`);
    }
  });
</script>
</body>
</html>
